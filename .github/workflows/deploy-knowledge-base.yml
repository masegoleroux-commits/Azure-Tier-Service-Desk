name: Deploy knowledge base

on:
  push:
    branches: [main]
    paths:
      - "Remote-Support-and-Ticketing-Showcase/knowledge-base/**"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build HTML site from Markdown
        run: |
          pip install markdown
          python Remote-Support-and-Ticketing-Showcase/src/build_kb_site.py

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: Remote-Support-and-Ticketing-Showcase/kb-site
          skip_app_build: true
